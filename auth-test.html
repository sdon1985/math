<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kids Math Test — Supabase Auth Test</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;background:#f5f7fb;color:#172033;padding:24px}
.card{max-width:720px;margin:auto;background:white;border:1px solid #dfe4ea;border-radius:18px;padding:24px;box-shadow:0 10px 35px #0001}
h1{margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button,input{font:inherit;padding:12px;border:1px solid #ccd3dd;border-radius:10px}
button{cursor:pointer;background:#eef2ff}.user.selected{outline:3px solid #4f46e5}
.primary{background:#4f46e5;color:white;border:0}.log{background:#101828;color:#e6edf3;padding:14px;border-radius:12px;white-space:pre-wrap;min-height:160px}
.ok{color:#067647}.bad{color:#b42318}.muted{color:#667085;font-size:13px}
</style>
<script src="./supabase-config.js"></script>
</head>
<body>
<div class="card">
<h1>🔐 Supabase Basic Authentication Test</h1>
<p class="muted">This page bypasses the Kids Math Test login UI and tests Supabase directly.</p>
<div class="row">
<button class="user selected" data-id="poorvi">👧 Poorvi</button>
<button class="user" data-id="mahiram">👦 Mahiram</button>
<button class="user" data-id="guest">👤 Guest</button>
<button class="user" data-id="admin">👑 Admin</button>
</div>
<input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="Supabase Auth password / PIN">
<button id="test" class="primary">Test Cloud Login</button>
<p id="status"></p>
<div id="log" class="log"></div>
</div>
<script>
(function(){
 let selected="poorvi";
 const cfg=window.KIDS_MATH_SUPABASE;
 const logEl=document.getElementById("log"),status=document.getElementById("status");
 function log(x){logEl.textContent+=(logEl.textContent?"\n":"")+x}
 function ok(x){status.className="ok";status.textContent=x}
 function bad(x){status.className="bad";status.textContent=x}
 document.querySelectorAll(".user").forEach(b=>b.onclick=()=>{
   selected=b.dataset.id;
   document.querySelectorAll(".user").forEach(x=>x.classList.toggle("selected",x===b));
   status.textContent="";
   logEl.textContent="";
 });
 async function run(){
   logEl.textContent="";
   if(!cfg){bad("supabase-config.js did not load");return}
   log("1. Config loaded");
   log("   URL: "+cfg.url);
   log("2. Looking up Auth email for app user: "+selected);
   try{
     const rpc=await fetch(cfg.url+"/rest/v1/rpc/get_auth_email",{
       method:"POST",
       headers:{
         "apikey":cfg.anonKey,
         "Authorization":"Bearer "+cfg.anonKey,
         "Content-Type":"application/json"
       },
       body:JSON.stringify({p_app_user_id:selected})
     });
     const txt=await rpc.text();
     log("   RPC HTTP "+rpc.status);
     if(!rpc.ok)throw new Error(txt);
     const email=String(txt).replace(/^"|"$/g,"");
     if(!email)throw new Error("RPC returned no email. Check auth_users mapping and SQL function.");
     log("   Auth email resolved: "+email);
     log("3. Testing Supabase Auth password");
     const auth=await fetch(cfg.url+"/auth/v1/token?grant_type=password",{
       method:"POST",
       headers:{
         "apikey":cfg.anonKey,
         "Content-Type":"application/json"
       },
       body:JSON.stringify({email:email,password:document.getElementById("pin").value})
     });
     const atxt=await auth.text();
     log("   Auth HTTP "+auth.status);
     if(!auth.ok)throw new Error(atxt);
     const a=JSON.parse(atxt);
     if(!a.access_token||!a.user)throw new Error("Auth response did not contain a session.");
     log("   Auth user UUID: "+a.user.id);
     log("4. Checking UUID → app user mapping");
     const map=await fetch(cfg.url+"/rest/v1/auth_users?select=auth_user_id,app_user_id&auth_user_id=eq."+encodeURIComponent(a.user.id),{
       headers:{apikey:cfg.anonKey,Authorization:"Bearer "+a.access_token}
     });
     const mtxt=await map.text();
     log("   Mapping HTTP "+map.status);
     if(!map.ok)throw new Error(mtxt);
     const rows=JSON.parse(mtxt);
     if(!rows.length)throw new Error("Auth user has no auth_users mapping.");
     if(rows[0].app_user_id!==selected)throw new Error("UUID is mapped to "+rows[0].app_user_id+", not "+selected+".");
     log("   Mapping OK: "+rows[0].app_user_id);
     ok("✅ BASIC SUPABASE AUTHENTICATION WORKS for "+selected+".");
   }catch(e){
     log("ERROR: "+e.message);
     bad("❌ Basic authentication failed. See the diagnostic details below.");
   }
 }
 document.getElementById("test").onclick=run;
})();
</script>
</body>
</html>
