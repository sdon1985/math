<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Poorvi Math — Login</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,#eef2ff,#f8fafc 55%,#ecfeff);color:#172033;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border:1px solid #e4e7ec;border-radius:26px;padding:28px;box-shadow:0 22px 65px rgba(16,24,40,.15);text-align:center}
.icon{width:72px;height:72px;margin:0 auto 13px;border-radius:22px;background:#eef2ff;display:grid;place-items:center;font-size:36px}
h1{font-size:27px;margin:0 0 4px}
.sub{color:#667085;font-size:14px;margin-bottom:20px}
.users{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.user{border:1px solid #d0d5dd;background:#fff;border-radius:13px;padding:10px 5px;cursor:pointer;font-weight:750;font-size:13px}
.user span{display:block;font-size:23px;margin-bottom:3px}
.user.selected{border-color:#4f46e5;background:#eef2ff;box-shadow:inset 0 0 0 1px #4f46e5}
.pinwrap{position:relative;margin-top:7px}
#pin{width:100%;border:1px solid #d0d5dd;border-radius:13px;padding:14px 50px 14px 16px;text-align:center;font-size:28px;letter-spacing:9px;outline:0}
#pin:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
#toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:19px;cursor:pointer}
#error{min-height:21px;color:#b42318;font-size:13px;margin:8px 0}
#continue{width:100%;border:0;border-radius:13px;padding:14px;background:linear-gradient(135deg,#4f46e5,#6366f1);color:#fff;font-size:16px;font-weight:800;cursor:pointer}
.links{margin-top:17px;font-size:12px}
.links a{color:#667085;text-decoration:none}
.links a:hover{color:#4f46e5}
@media(max-width:420px){.users{grid-template-columns:1fr}.card{padding:23px}}
</style>
<style id="adminLoginChoiceStyle">
.adminChoice{grid-column:1/-1}
.adminChoice.selected{border-color:#7c3aed;background:#f5f3ff;box-shadow:inset 0 0 0 1px #7c3aed}
</style><style id="kidsMathVersionBadge">
#kidsMathVersionBadge{
position:fixed;left:50%;bottom:8px;transform:translateX(-50%);
z-index:2147483647;padding:4px 10px;border-radius:999px;
font:700 11px/1.2 Arial,sans-serif;letter-spacing:.2px;
background:rgba(255,255,255,.94);color:#475569;
border:1px solid #cbd5e1;box-shadow:0 2px 8px rgba(0,0,0,.12);
pointer-events:none;white-space:nowrap;
}
</style><script src="supabase-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
window.addEventListener("DOMContentLoaded",function(){
 const c=window.KIDS_MATH_SUPABASE;
 if(c&&c.url&&!c.url.includes("YOUR-PROJECT")&&c.anonKey&&!c.anonKey.includes("YOUR_")){
   window.kidsMathSupabase=supabase.createClient(c.url,c.anonKey);
 }
});
</script></head>
<body>
<main class="card">
  <div class="icon">📚</div>
  <h1>Math Practice</h1>
  <div class="sub">Choose an account</div>
  <div class="users">
    <button class="user selected" data-id="guest"><span>👤</span>Guest</button>
    <button class="user" data-id="poorvi"><span>👧</span>Poorvi</button>
    <button class="user" data-id="mahiram"><span>👦</span>Mahiram</button>
    <button class="user adminChoice" data-id="admin"><span>👑</span>Admin</button>
  </div>
  <div class="pinwrap">
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••" aria-label="PIN">
    <button id="toggle" type="button" aria-label="Show PIN">👁️</button>
  </div>
  <div id="error"></div>
  <button id="continue" type="button">Continue →</button>
  <div class="links"><a href="index.html">Open User Page</a> · <a href="admin.html">👑 Admin Login</a></div>
</main>
<script>
(function(){
  const defaults=[
    {id:"guest",name:"Guest",role:"user",pin:"0000",active:true},
    {id:"poorvi",name:"Poorvi Dondeti",role:"user",pin:"1111",active:true},
    {id:"mahiram",name:"Mahiram Dondeti",role:"user",pin:"2222",active:true},
    {id:"admin",name:"Admin",role:"admin",pin:"2580",active:true}
  ];
  let selected="guest";
  const pin=document.getElementById("pin"), error=document.getElementById("error");
  function getUsers(){
    try{
      const raw=localStorage.getItem("poorviMathUsers");
      if(!raw){localStorage.setItem("poorviMathUsers",JSON.stringify(defaults));return defaults}
      const arr=JSON.parse(raw);
      return Array.isArray(arr)&&arr.length?arr:defaults;
    }catch(e){return defaults}
  }
  function select(id){
    selected=id; error.textContent=""; pin.value="";
    document.querySelectorAll(".user").forEach(b=>b.classList.toggle("selected",b.dataset.id===id));
    pin.focus();
  }
  document.querySelectorAll(".user").forEach(b=>b.onclick=()=>select(b.dataset.id));
  document.getElementById("toggle").onclick=()=>{
    pin.type=pin.type==="password"?"text":"password";
    document.getElementById("toggle").textContent=pin.type==="password"?"👁️":"🙈";
  };
  function login(){
    const u=getUsers().find(x=>x.id===selected&&x.active!==false);
    if(!u){error.textContent="Account is unavailable.";return}
    if(String(pin.value||"")!==String(u.pin)){
      error.textContent="Incorrect PIN. Please try again.";pin.select();return
    }
    // User identity is owned exclusively by login.html.
    // Clear the previous identity before establishing the newly selected user.
    sessionStorage.removeItem("poorviCurrentUser");
    sessionStorage.removeItem("poorviActiveTest");
    sessionStorage.setItem("poorviLoginAt",String(Date.now()));
    if(u.role==="admin"){
      sessionStorage.setItem("poorviAdminAuthenticated","1");
      window.location.replace("admin.html");
    }else{
      sessionStorage.setItem("poorviCurrentUser",u.id);
      localStorage.setItem("poorviLoggedInUser",u.id);
      window.location.replace("index.html");
    }
  }
  document.getElementById("continue").onclick=login;
  pin.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();login()}};
  window.addEventListener("load",()=>pin.focus());
})();
</script>
<div id="kidsMathVersionBadge" aria-label="Production version">Production v1.2.2</div><script id="kidsMathSupabaseRealLogin">
(function(){
  function ready(){
    return window.kidsMathSupabase ||
      (window.supabase && window.KIDS_MATH_SUPABASE
       ? (window.kidsMathSupabase=window.supabase.createClient(
            window.KIDS_MATH_SUPABASE.url,window.KIDS_MATH_SUPABASE.anonKey))
       : null);
  }
  async function loginWithSupabase(email,password){
    const sb=ready();
    if(!sb) throw new Error("Supabase is not configured. Check supabase-config.js.");
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;
    const {data:map,error:me}=await sb.from("auth_users")
      .select("app_user_id").eq("auth_user_id",data.user.id).single();
    if(me) throw new Error("This login is not linked to a Kids Math Test user.");
    const {data:profile,error:pe}=await sb.from("kids_users")
      .select("*").eq("id",map.app_user_id).single();
    if(pe) throw pe;
    sessionStorage.setItem("poorviCurrentUser",profile.id);
    sessionStorage.setItem("poorviAuthMode","supabase");
    sessionStorage.setItem("poorviDisplayName",profile.display_name);
    sessionStorage.setItem("poorviRole",profile.role);
    return profile;
  }

  async function handle(e){
    const form=e.target;
    if(!form || form.tagName!=="FORM")return;
    const email=form.querySelector('input[type="email"],input[name="email"]');
    const password=form.querySelector('input[type="password"],input[name="password"]');
    if(!email||!password)return;
    e.preventDefault(); e.stopImmediatePropagation();
    const btn=form.querySelector('button[type="submit"]');
    const old=btn&&btn.textContent;
    if(btn){btn.disabled=true;btn.textContent="Signing in...";}
    try{
      const p=await loginWithSupabase(email.value.trim(),password.value);
      location.href=p.role==="admin"?"admin.html":"index.html";
    }catch(err){
      alert(err.message||"Login failed.");
      try{if(window.kidsMathSupabase)await window.kidsMathSupabase.auth.signOut()}catch(_){}
    }finally{
      if(btn){btn.disabled=false;btn.textContent=old||"Login";}
    }
  }
  document.addEventListener("submit",handle,true);
})();
</script></body>
</html>
