<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kids Math Test — Admin</title><script src="./app-config.js"></script><script src="./cloud.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#142033;--muted:#667085;--line:#dfe5ee;--brand:#2563eb;--good:#eaf8ef;--danger:#fff0f0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial}
button{font:inherit;cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:16px}.header,.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 35px #10182812}.header{padding:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.header h1{margin:0;font-size:27px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;min-height:42px}.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.danger{background:var(--danger);color:#a32929}.card{padding:18px;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}.stat{background:#f7f9fc;border-radius:12px;padding:11px;text-align:center}.stat b{display:block;font-size:21px}.userGroup{border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}.userHead{background:#f8fafc;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.row{padding:12px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#fff3cd;font-size:12px}.empty{text-align:center;padding:24px;color:var(--muted)}.review{border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px}.reviewTop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.question{display:grid;grid-template-columns:55px 1fr 150px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #edf0f4}.answerImg{width:120px;height:70px;object-fit:contain;border:1px solid #cfd6df;border-radius:8px;background:#fff}.status{display:flex;gap:6px;flex-wrap:wrap}.status button{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff}.status .selC{background:#dcfce7;color:#166534;border-color:#86efac}.status .selW{background:#fee2e2;color:#991b1b;border-color:#fecaca}.status .selN{background:#eef2f6;color:#475467}.hidden{display:none!important}.footer{text-align:center;color:#7b8797;font-size:12px;padding:20px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.question{grid-template-columns:35px 1fr}.question .answerImg{grid-column:2;width:100%;max-width:180px}.question .status{grid-column:2}}
</style></head><body>
<div class="wrap">
<header class="header"><div><div style="font-size:12px;font-weight:900;letter-spacing:.12em;color:#64748b">KIDS MATH TEST • ADMIN</div><h1>👑 Parent Dashboard</h1><div class="muted">Cloud worksheets, reviews and progress</div></div>
<div class="actions"><a class="btn" href="index.html">👤 User Page</a><a class="btn" href="login.html">🔐 Switch Login</a><button id="refresh" class="btn">↻ Refresh</button></div></header>
<section class="card"><div style="font-size:20px;font-weight:900">Pending Reviews</div><div class="muted">Submitted worksheets waiting for parent scoring.</div><div id="pending"></div></section>
<section class="card"><div style="font-size:20px;font-weight:900">User Progress</div><div class="muted">Cloud data grouped by user.</div><div id="users"></div></section>
<section id="reviewCard" class="card hidden"><div class="reviewTop"><div><div style="font-size:20px;font-weight:900">📝 Review Worksheet</div><div id="reviewMeta" class="muted"></div></div><div class="actions"><button id="save" class="btn primary">✓ Save Review</button><button id="close" class="btn">Close</button></div></div><div id="questions"></div></section>
<div class="footer">Production 2.0.0 • Supabase Cloud</div>
</div>
<script>
(function(){
let selected=null, rows=[];
const $=id=>document.getElementById(id);
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function op(x){return ({addition:"➕ Addition",subtraction:"➖ Subtraction",multiplication:"✖️ Multiplication",division:"➗ Division",mixed:"🔢 Mixed"})[x]||x||"Worksheet"}
async function guard(){
 try{
  if(sessionStorage.getItem("poorviAuthMode")!=="supabase")return location.replace("login.html");
  const u=await KMT.me();if(!u||u.role!=="admin"){await KMT.logout();sessionStorage.clear();return location.replace("login.html")}
  sessionStorage.setItem("poorviDisplayName",u.name);
  await load();
 }catch(e){console.error(e);$("pending").innerHTML='<div class="empty">Unable to load cloud data. Please refresh or login again.</div>'}
}
async function load(){
 rows=await KMT.pending();
 renderPending(); await renderUsers();
}
function renderPending(){
 if(!rows.length){$("pending").innerHTML='<div class="empty">🎉 No worksheets waiting for review.</div>';return}
 const groups={};rows.forEach(r=>{(groups[r.user_id]??=[]).push(r)});
 $("pending").innerHTML=Object.entries(groups).map(([uid,arr])=>{
  const name=arr[0].user_name||uid;
  return '<div class="userGroup"><div class="userHead"><div><b>👤 '+esc(name)+'</b><div class="muted">'+arr.length+' worksheet'+(arr.length===1?'':'s')+'</div></div></div>'+
  arr.map(r=>'<div class="row"><div><b>'+op(r.operation)+'</b> <span class="tag">⏳ Pending Review</span><div class="muted">'+new Date(r.submitted_at).toLocaleString()+' • '+(r.total||0)+' questions'+(r.range?' • '+esc(r.range):'')+'</div></div><button class="btn primary" data-review="'+esc(r.id)+'">Review</button></div>').join('')+'</div>'
 }).join('');
 document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>openReview(b.dataset.review));
}
async function renderUsers(){
 const ids=["poorvi","mahiram","guest"],names={"poorvi":"Poorvi Dondeti","mahiram":"Mahiram Dondeti","guest":"Guest"};
 let html="";
 for(const id of ids){
  try{
   const p=await KMT.progress(id);const total=p.length;const correct=p.reduce((s,x)=>s+(x.correct||0),0),q=p.reduce((s,x)=>s+(x.total||0),0),avg=q?Math.round(correct*100/q):0;
   html+='<div class="userGroup"><div class="userHead"><b>👤 '+names[id]+'</b><span class="muted">'+total+' reviewed worksheets</span></div><div class="stats"><div class="stat"><b>'+total+'</b>Worksheets</div><div class="stat"><b>'+avg+'%</b>Accuracy</div><div class="stat"><b>'+correct+'</b>Correct</div><div class="stat"><b>'+p.reduce((s,x)=>s+(x.wrong||0),0)+'</b>Wrong</div><div class="stat"><b>'+p.reduce((s,x)=>s+(x.not_answered||0),0)+'</b>Not Answered</div></div></div>';
  }catch(e){}
 }
 $("users").innerHTML=html||'<div class="empty">No progress yet.</div>';
}
function openReview(id){
 selected=rows.find(r=>r.id===id);if(!selected)return;
 const s=selected.submission||{};const answers=Array.isArray(s.answers)?s.answers:[];
 $("reviewMeta").textContent=(selected.user_name||selected.user_id)+" • "+op(selected.operation)+" • "+new Date(selected.submitted_at).toLocaleString()+" • "+answers.length+" questions";
 $("questions").innerHTML=answers.map(a=>'<div class="question" data-q="'+a.i+'"><b>#'+(a.i+1)+'</b><div><b>'+esc(a.problem)+' = '+esc(a.ans)+'</b><div class="muted">App reading: '+esc(a.ocr||"not recognized")+'</div></div>'+(a.image?'<img class="answerImg" src="'+a.image+'">':'<div class="muted">No handwriting</div>')+'<div class="status"><button data-s="correct" class="'+(a.status==="correct"?"selC":"")+'">✓ Correct</button><button data-s="wrong" class="'+(a.status==="wrong"?"selW":"")+'">✗ Wrong</button><button data-s="not_answered" class="'+(a.status==="not_answered"?"selN":"")+'">— Not Answered</button></div></div>').join("");
 document.querySelectorAll(".question").forEach(q=>q.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const a=answers.find(x=>x.i===+q.dataset.q);a.status=b.dataset.s;openReview(id)}));
 $("reviewCard").classList.remove("hidden");$("reviewCard").scrollIntoView({behavior:"smooth"});
}
$("save").onclick=async()=>{
 if(!selected)return;const s=selected.submission||{},answers=Array.isArray(s.answers)?s.answers:[];
 if(answers.some(a=>!["correct","wrong","not_answered"].includes(a.status))){alert("Please mark every answer before saving.");return}
 const b=$("save");b.disabled=true;b.textContent="Saving…";
 try{
  await KMT.reviewed(selected.id,answers,{userId:selected.user_id,userName:selected.user_name,date:new Date(selected.submitted_at).toISOString().slice(0,10),elapsed:selected.elapsed||0,operation:selected.operation,range:selected.range});
  $("reviewCard").classList.add("hidden");selected=null;await load();
 }catch(e){alert(e.message||"Unable to save review.")}finally{b.disabled=false;b.textContent="✓ Save Review"}
};
$("close").onclick=()=>{$("reviewCard").classList.add("hidden");selected=null};
$("refresh").onclick=load;
guard();
})();
</script></body></html>
